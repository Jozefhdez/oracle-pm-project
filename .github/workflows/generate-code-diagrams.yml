name: Generate PlantUML code diagrams

on:
  push:
    branches:
      - main
    paths:
      - "MtdrSpring/backend/pom.xml"
      - "MtdrSpring/backend/src/main/java/**"
      - "architecture/workspace.dsl"
      - ".github/workflows/generate-code-diagrams.yml"

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MtdrSpring/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generate PlantUML diagrams
        run: mvn -B -DskipTests process-classes

      - name: Commit regenerated diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate PlantUML code diagrams [skip ci]"
          file_pattern: docs/diagrams/*.puml