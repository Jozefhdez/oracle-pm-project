apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
  namespace: mtdrworkshop
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 2
  template:
    metadata:
      annotations:
        deploy-time: "${IMAGE_TAG}"
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      containers:
        - name: todolistapp-springboot
          image: mx-queretaro-1.ocir.io/axeeisoondbm/reacttodo/q80kr/todolistapp-springboot:0.1
          imagePullPolicy: Always
          env:
            - name: DB_USER
              value: "TODOUSER"
            - name: DB_URL
              value: "jdbc:oracle:thin:@oraclepmdb_tp"
            - name: TNS_ADMIN
              value: "/mtdrworkshop/creds"
            - name: OCI_REGION
              value: "mx-queretaro-1"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbuser
                  key: dbpassword
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-secret
                  key: token
                  optional: false
            - name: TELEGRAM_BOT_NAME
              value: "oci_cloud_devops_bot"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: apikey
                  optional: false
            - name: GEMINI_API_BASE_URL
              value: "https://generativelanguage.googleapis.com/v1beta"
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot
---
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-springboot-service
  namespace: mtdrworkshop
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
spec:
  type: LoadBalancer
  selector:
    app: todolistapp-springboot
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
