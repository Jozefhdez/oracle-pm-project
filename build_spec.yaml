version: 0.1
component: build
timeoutInSeconds: 900
shell: bash

env:
  variables:
    DOCKER_REGISTRY: "mx-queretaro-1.ocir.io/axeeisoondbm/reacttodo/q80kr"
    OCIR_USER: "axeeisoondbm/a01644644@tec.mx"
    TODO_PDB_NAME: "oraclepmdb"
    OCI_REGION: "mx-queretaro-1"
    IMAGE_NAME: "todolistapp-springboot"
    IMAGE_TAG: "0.1"
    REACT_APP_OIDC_AUTHORITY: "https://idcs-a333fea8b68e4aff8867ff6094453a03.identity.oraclecloud.com"
    REACT_APP_OIDC_CLIENT_ID: "7809ed300a374eafa7bb9403f8f1ff01"

  vaultVariables:
    OCIR_AUTH_TOKEN: "ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaazfu3rdyaxhpi54af5li673un6573vzu57exuiq2xzfyvmxgegi5q"
    REACT_APP_OIDC_CLIENT_SECRET: "ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaazfu3rdyacgf65ctfvesmjicyx52eb4423bme4mpvq2pxisfrthja"

  exportedVariables:
    - DOCKER_REGISTRY
    - IMAGE_NAME
    - IMAGE_TAG
    - TODO_PDB_NAME

steps:
  - type: Command
    name: "Install Java 17"
    command: |
      yum -y install java-17-openjdk-devel
      export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
      echo "JAVA_HOME=$JAVA_HOME"
      java -version

  - type: Command
    name: "Login to OCIR"
    command: |
      echo "$OCIR_AUTH_TOKEN" | docker login ${OCI_REGION}.ocir.io \
        -u "${OCIR_USER}" --password-stdin

  - type: Command
    name: "Build JAR and frontend"
    command: |
      export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
      export PATH=$JAVA_HOME/bin:$PATH
      cd MtdrSpring/backend
      mvn --no-transfer-progress clean package -DskipTests

  - type: Command
    name: "Build and push Docker image"
    command: |
      cd MtdrSpring/backend
      docker build -t ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} .
      docker push ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
      echo "Image pushed: ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
