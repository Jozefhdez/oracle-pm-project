version: 0.1
component: build
timeoutInSeconds: 900
shell: bash

env:
  variables:
    DOCKER_REGISTRY: "mx-queretaro-1.ocir.io/axeeisoondbm/reacttodo/q80kr"
    OCIR_USER: "axeeisoondbm/a01644644@tec.mx"
    TODO_PDB_NAME: "oraclepmdb"
    OCI_REGION: "mx-queretaro-1"
    IMAGE_NAME: "todolistapp-springboot"
    IMAGE_TAG: "0.1"

  vaultVariables:
    OCIR_AUTH_TOKEN: "ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaazfu3rdyaxhpi54af5li673un6573vzu57exuiq2xzfyvmxgegi5q"

  exportedVariables:
    - DOCKER_REGISTRY
    - IMAGE_NAME
    - IMAGE_TAG
    - TODO_PDB_NAME

steps:
  - type: Command
    name: "Install Java 17"
    command: |
      yum -y install java-17-openjdk-devel
      export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
      echo "JAVA_HOME=$JAVA_HOME"
      java -version

  - type: Command
    name: "Login to OCIR"
    command: |
      echo "$OCIR_AUTH_TOKEN" | docker login ${OCI_REGION}.ocir.io \
        -u "${OCIR_USER}" --password-stdin

  - type: Command
    name: "Build JAR and frontend"
    command: |
      export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
      export PATH=$JAVA_HOME/bin:$PATH
      cd MtdrSpring/backend
      mvn --no-transfer-progress clean package -DskipTests

  - type: Command
    name: "Build and push Docker image"
    command: |
      cd MtdrSpring/backend
      docker build -t ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} .
      docker push ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
      echo "Image pushed: ${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

  - type: Command
    name: "Restart K8s deployment"
    command: |
      curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
      chmod +x kubectl && mv kubectl /usr/local/bin/
      COMPARTMENT_ID=$(oci iam compartment list --all \
        --query "data[?name=='reacttodo'].id | [0]" --raw-output)
      CLUSTER_ID=$(oci ce cluster list \
        --compartment-id "$COMPARTMENT_ID" \
        --query "data[?\"lifecycle-state\"=='ACTIVE'].id | [0]" --raw-output)
      mkdir -p $HOME/.kube
      oci ce cluster create-kubeconfig \
        --cluster-id "$CLUSTER_ID" \
        --file $HOME/.kube/config \
        --region ${OCI_REGION} \
        --token-version 2.0.0 \
        --kube-endpoint PUBLIC_ENDPOINT
      kubectl rollout restart deployment/todolistapp-springboot-deployment -n mtdrworkshop
      kubectl rollout status deployment/todolistapp-springboot-deployment -n mtdrworkshop --timeout=120s
